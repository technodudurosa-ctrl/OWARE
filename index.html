<script>
/* ===== COLE AQUI A CONFIGURAÇÃO DO SEU FIREBASE (passo 3 do guia) ===== */
const FB={apiKey:'AIzaSyDj6CtkxEUj_VKU2JS7-wYQAhUu-0aakC4',authDomain:'oware-a198f.firebaseapp.com',projectId:'oware-a198f',appId:'1:741198575158:web:035ba0c172eddf2a1bca97'};
const EM='@oware.game';
let FU=null,AU=null;
const $=id=>document.getElementById(id);
/* ---------- LÓGICA (regras do Oware) ---------- */
const side=i=>i<6?0:1;
const reach=(i,p)=>(p===0?6:12)-i;
function legal(h,p){
  const mine=[];for(let i=p*6;i<p*6+6;i++)if(h[i]>0)mine.push(i);
  const opp=h.slice((1-p)*6,(1-p)*6+6).reduce((a,b)=>a+b,0);
  return opp===0?mine.filter(i=>h[i]>=reach(i,p)):mine;
}
function sim(h0,i,p){
  const h=h0.slice();let n=h[i],pos=i;h[i]=0;const sow=[];
  while(n>0){pos=(pos+1)%12;if(pos===i)continue;h[pos]++;n--;sow.push(pos)}
  let cap=[],got=0;
  if(side(pos)!==p){
    let q=pos;
    while(side(q)!==p&&(h[q]===2||h[q]===3)){cap.push(q);got+=h[q];q=(q+11)%12}
    const opp=h.slice((1-p)*6,(1-p)*6+6).reduce((a,b)=>a+b,0);
    if(got===opp){cap=[];got=0} // sem “grand slam”: não se captura todas as sementes do adversário
  }
  cap.forEach(c=>h[c]=0);
  return{h,sow,cap,got};
}
let tut=null;
const names=['Jogador 1','Jogador 2'];
let seen={};
let h=Array(12).fill(4),score=[0,0],player=0,over=false,busy=false;

/* ---------- CENA 3D ---------- */
const stage=$('stage'),cvs=document.createElement('canvas'),ctx=cvs.getContext('2d'),el=cvs;
stage.prepend(cvs);
class V3{constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z}clone(){return new V3(this.x,this.y,this.z)}copy(v){this.x=v.x;this.y=v.y;this.z=v.z;return this}
  lerpVectors(a,b,t){this.x=a.x+(b.x-a.x)*t;this.y=a.y+(b.y-a.y)*t;this.z=a.z+(b.z-a.z)*t;return this}}
const T={Vector3:V3},seeds=new Set(),scene={add:m=>seeds.add(m),remove:m=>seeds.delete(m)};
let W=1,H=1,dpr=1;
// posições: 0–5 embaixo (J1, esq→dir), 6–11 em cima (J2, dir→esq), 12 = casa J1 (direita), 13 = casa J2 (esquerda)
const cx=[],cz=[];
for(let i=0;i<12;i++){const col=i<6?i:11-i;cx[i]=(col-2.5)*1.5;cz[i]=i<6?1:-1}
cx[12]=6.5;cz[12]=0;cx[13]=-6.5;cz[13]=0;
const rings=[];for(let c=0;c<12;c++)rings[c]={userData:{on:false}};
function label(){}
// câmera 3D própria (perspectiva + órbita)
const C={};
function camUpdate(){
  const a=Math.max(.4,W/H),port=a<.85,d=zoom*(port?Math.max(34,10/a):Math.max(16,27/a)),tt=th+(port?-Math.PI/2:0),pp=Math.max(.15,ph-(port?.4:0));C.oy=H*(tut?-.16:(port?-.06:-.05));
  C.px=d*Math.sin(pp)*Math.sin(tt);C.py=d*Math.cos(pp);C.pz=d*Math.sin(pp)*Math.cos(tt);
  let f=[-C.px,-.3-C.py,-C.pz];const fl=Math.hypot(...f);f=f.map(v=>v/fl);
  let r=[-f[2],0,f[0]];const rl=Math.hypot(...r);r=r.map(v=>v/rl);
  C.f=f;C.r=r;C.u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];C.fp=(H/2)/Math.tan(20*Math.PI/180);
}
function P(x,y,z){
  const vx=x-C.px,vy=y-C.py,vz=z-C.pz,d=vx*C.f[0]+vy*C.f[1]+vz*C.f[2],k=C.fp/d;
  return[W/2+(vx*C.r[0]+vy*C.r[1]+vz*C.r[2])*k,H/2+C.oy-(vx*C.u[0]+vy*C.u[1]+vz*C.u[2])*k,d,k];
}
const poly=pts=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()};
// contorno do tabuleiro (retângulo arredondado) e veios da madeira
const OUT=[];(function(){const w=8.5,d=2.4,r=.5;[[w-r,d-r,0],[-w+r,d-r,1],[-w+r,-d+r,2],[w-r,-d+r,3]].forEach(([x,z,q])=>{for(let i=0;i<=6;i++){const a=(q*90+i*15)*Math.PI/180;OUT.push([x+Math.cos(a)*r,z+Math.sin(a)*r])}})})();
const GR=Array.from({length:40},(_,i)=>({z:-2.4+i*.12,o:Array.from({length:7},()=>(Math.random()-.5)*.1),a:.1+Math.random()*.16}));
function ell(c,y,sc){const rx=(c>11?.9:.66)*sc,rz=(c>11?1.95:.66)*sc,p=[];for(let i=0;i<36;i++){const a=i/36*6.2832;p.push(P(cx[c]+Math.cos(a)*rx,y,cz[c]+Math.sin(a)*rz))}return p}
function drawBoard(now){
  // fundo (feltro) e sombra
  const bg=ctx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,Math.max(W,H)*.75);bg.addColorStop(0,'#3d7556');bg.addColorStop(1,'#1c3a29');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#000a';ctx.shadowBlur=35;ctx.fillStyle='#0006';poly(OUT.map(p=>P(p[0],-.9,p[1])));ctx.fill();ctx.restore();
  // laterais visíveis
  for(let i=0;i<OUT.length;i++){
    const a=OUT[i],b=OUT[(i+1)%OUT.length],dx=b[0]-a[0],dz=b[1]-a[1],mx=(a[0]+b[0])/2,mz=(a[1]+b[1])/2;
    let nx=dz,nz=-dx;if(nx*mx+nz*mz<0){nx=-nx;nz=-nz}const nl=Math.hypot(nx,nz)||1;nx/=nl;nz/=nl;
    if(nx*(C.px-mx)+nz*(C.pz-mz)<=0)continue;
    const l=Math.max(.35,.55+.45*(nx*-.4+nz*.8));ctx.fillStyle=`rgb(${74*l|0},${40*l|0},${18*l|0})`;
    poly([P(a[0],0,a[1]),P(b[0],0,b[1]),P(b[0],-.78,b[1]),P(a[0],-.78,a[1])]);ctx.fill();
  }
  // tampo
  const top=OUT.map(p=>P(p[0],0,p[1]));ctx.fillStyle='#7d4b26';poly(top);ctx.fill();
  ctx.save();poly(top);ctx.clip();ctx.lineWidth=1.3;
  GR.forEach(g=>{ctx.strokeStyle=`rgba(46,23,10,${g.a})`;ctx.beginPath();g.o.forEach((o,i)=>{const p=P(-8.5+i*17/6,0,g.z+o);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.stroke()});ctx.restore();
  ctx.strokeStyle='#3a1d0e';ctx.lineWidth=2;poly(top);ctx.stroke();
  // faixas entalhadas (zigue-zague)
  [-2.05,2.05].forEach(z=>{ctx.fillStyle='#2b1509';poly([P(-7.8,.003,z-.14),P(7.8,.003,z-.14),P(7.8,.003,z+.14),P(-7.8,.003,z+.14)]);ctx.fill();
    ctx.fillStyle='#d9a45a';for(let i=0;i<20;i++){const x=-7.8+i*.78;poly([P(x+.04,.004,z+.12),P(x+.39,.004,z-.12),P(x+.74,.004,z+.12)]);ctx.fill()}});
  // cavidades côncavas
  for(let c=0;c<14;c++){
    const dep=c>11?.5:.36;
    ctx.fillStyle='#4d2915';poly(ell(c,0,1));ctx.fill();ctx.strokeStyle='#241106';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#34190b';poly(ell(c,-dep*.5,.86));ctx.fill();
    const b=ell(c,-dep,.62),m=P(cx[c],-dep,cz[c]),gr=ctx.createRadialGradient(m[0],m[1],1,m[0],m[1],(c>11?1.95:.66)*m[3]*.7);gr.addColorStop(0,'#120602');gr.addColorStop(1,'#2d1608');
    ctx.fillStyle=gr;poly(b);ctx.fill();
    // brilho do aro
    ctx.strokeStyle='#ffffff14';ctx.lineWidth=1.5;poly(ell(c,.001,1.03));ctx.stroke();
  }
  // anéis dourados (cavidades jogáveis)
  const pl=.5+.5*Math.sin(now*.005);
  rings.forEach((g,c)=>{const o=g.userData.on?(c===hover?1:.45+.4*pl):0;if(o<=0)return;
    ctx.save();ctx.globalAlpha=o;ctx.strokeStyle='#f4c75e';ctx.shadowColor='#f4c75e';ctx.shadowBlur=12;ctx.lineWidth=c===hover?5:3.5;poly(ell(c,.06,c===hover?1.22:1.14));ctx.stroke();ctx.restore()});
}
function drawSeeds(){
  const list=[];seeds.forEach(m=>{const p=P(m.position.x,m.position.y,m.position.z);list.push([m,p])});
  list.sort((a,b)=>b[1][2]-a[1][2]);
  list.forEach(([m,p])=>{if(m.position.y>.25){const q=P(m.position.x,.02,m.position.z),a=Math.max(0,.35-m.position.y*.1);ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.ellipse(q[0],q[1],.17*q[3],.1*q[3],0,0,6.3);ctx.fill()}});
  list.forEach(([m,p])=>{const r=.16*p[3];ctx.drawImage(SPR[m.col],p[0]-r,p[1]-r,2*r,2*r)});
}
function drawLabels(){
  for(let c=0;c<14;c++){
    const st=c>11,p=st?P(cx[c],1.5,cz[c]):P(cx[c],.5,cz[c]+(c<6?1:-1)),r=(st?.5:.27)*p[3],n=S[c].length;
    ctx.fillStyle='#302116dd';ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.3);ctx.fill();ctx.strokeStyle='#f4c75e';ctx.lineWidth=Math.max(1.5,r*.1);ctx.stroke();
    ctx.fillStyle='#fff4df';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${r*(st?1:.95)}px system-ui,Arial`;ctx.fillText(n,p[0],p[1]+(st?0:r*.18));
    if(!st){ctx.fillStyle='#f4c75e';ctx.font=`bold ${r*.5}px system-ui,Arial`;ctx.fillText(c<6?'ABCDEF'[c]:'abcdef'[c-6],p[0],p[1]-r*.5)}
  }
}
// sementes
const S=Array.from({length:14},()=>[]);
const SPR=['#7a736a','#5b5047','#9b9185','#3e342c','#8a6a45','#b8ad9c'].map(col=>{

async function play(i,rem){
  if(busy||over)return;
  if(net&&!rem&&(!net.on||player!==net.seat))return;
  if(tut){if(tut.target==null||tut.moved)return;if(i!==tut.target){$('thint').textContent='👆 Toque na cavidade dourada que está brilhando.';sfx('bad');return}}
  if(side(i)!==player||h[i]===0)return;
  if(!legal(h,player).includes(i)){say('Dê sementes ao adversário, que está sem sementes. Escolha outra cavidade.');sfx('bad');return}
  if(net&&!rem){net.moves.push(i);net.n=net.moves.length;DB.doc('matches/'+net.mid).update({moves:net.moves}).catch(()=>{})}
  busy=true;updateRings();sfx('pick');
  const r=sim(h,i,player),p=player;
  // pegar as sementes
  const hand=S[i].splice(0);label(i);
  await Promise.all(hand.map((m,k)=>go(m,new T.Vector3(cx[i]+(k%3-1)*.18,2.2+Math.floor(k/3)*.2,cz[i]+(Math.floor(k/3)%2)*.15),320,.3,k*25)));
  // semear uma a uma
  for(const t of r.sow){
    const m=hand.pop();S[t].push(m);label(t);tick(300+t*25);
    await go(m,slot(t,S[t].length-1),Math.max(170,320-r.sow.length*6),1.1);
  }
  // capturar
  if(r.cap.length){
    await sleep(250);const st=p===0?12:13;
    for(const c of r.cap){
      const ms=S[c].splice(0);label(c);
      await Promise.all(ms.map((m,k)=>{S[st].push(m);return go(m,slot(st,S[st].length-1),450,1.6,k*60)}));
      label(st);sfx('cap',r.got);
    }
  }
  h=r.h;score[p]+=r.got;if(p===(net?net.seat:0)&&r.got>mc)mc=r.got;if(r.got&&navigator.vibrate)navigator.vibrate(40);
  const nxt=1-p,key=h.join()+nxt+score;seen[key]=(seen[key]||0)+1;
  if(score[0]>=25||score[1]>=25||legal(h,nxt).length===0||seen[key]>=3){await finish(score[0]<25&&score[1]<25);return}
  player=nxt;busy=false;ui();
  if(tut){tutDone();return}
  say(`${names[p]} jogou ${i<6?'ABCDEF'[i]:'abcdef'[i-6]}. ${names[player]}, sua vez.${r.got?` ${names[p]} capturou ${r.got} sementes.`:''}`);
  if($('cpu').checked&&player===1)setTimeout(()=>play(cpuPick()),700);
}
async function finish(sweep=true){
  const ps=[];
  for(let c=0;sweep&&c<12;c++){const st=side(c)===0?12:13;if(h[c]){score[side(c)]+=h[c]}
    S[c].splice(0).forEach((m,k)=>{S[st].push(m);ps.push(go(m,slot(st,S[st].length-1),500,1,k*40+c*20))});label(c)}
  if(sweep)h.fill(0);await Promise.all(ps);label(12);label(13);
  over=true;busy=false;ui();setTimeout(showWin,900);report();

}
let LV=1;
function cpuPick(){const L=legal(h,1);if(LV===0)return L[Math.floor(Math.random()*L.length)];
  let best=-1,bs=-1e9;
  for(const i of L){const r=sim(h,i,1);let sc=r.got*10+Math.random()*3;
    if(LV===2){let m=0;for(const j of legal(r.h,0))m=Math.max(m,sim(r.h,j,0).got);sc=r.got*10-m*9+Math.random()}

  return best;
}

const tagH=a=>{const t=tagsOf(a);return lc(a.n)===lc(OWNER)?'<span class="tag dudu">👑 [DUDU+++]</span>':(t.length?`<span class="tag">[${esc(t[t.length-1])}]</span>`:'')};
const av=(a,s)=>a.av&&/^data:image\/jpeg;base64,[\w+\/=]+$/.test(a.av)?`<img class="av" style="width:${s}px;height:${s}px" src="${a.av}">`:`<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.6}px">${esc(a.n)[0]||'?'}</span>`;
let DB=null,USR=null,authRole='player',me=null,net=null,rkd=null,mc=0,GOLD=false,qun=null,mun=null,mk=0,pmp=0;
const isAdm=()=>!!FU&&['owner','admin'].includes(authRole);
SPR[6]=(()=>{const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.fillStyle='#f4c75e';x.beginPath();x.arc(24,24,23,0,6.3);x.fill();const g=x.createRadialGradient(17,15,1,24,24,24);g.addColorStop(0,'#fff');g.addColorStop(.5,'#fff0');g.addColorStop(1,'#8a5a0066');x.fillStyle=g;x.fill();return c})();
async function gA(n){n=lc(n);if(DB){const s=await DB.doc('accounts/'+n).get();return s.exists?s.data():null}try{return JSON.parse(localStorage.getItem('oa_'+n))}catch(e){return null}}
async function sA(a){const n=lc(a.n);if(DB)await DB.doc('accounts/'+n).set(a);else try{localStorage.setItem('oa_'+n,JSON.stringify(a))}catch(e){}}
const newAcc=n=>({n,uid:FU?FU.uid:'',av:'',r:1000,g:0,w:0,l:0,st:0,bst:0,cap:0,xt:[],t:Date.now()});
function mnu(){const e=$('mp');if(!e)return;e.innerHTML=me?`<div onclick="$('pf').click()" title="Trocar foto">${av(me,56)}</div><div onclick="openAcc()"><div class="nm">${tagH(me)} ${esc(me.n)}</div><small>${rk(me.r,me.rankTier)[2]} ${rk(me.r,me.rankTier)[1]} • ${me.r} pts</small><small>📷 Toque na foto para trocar</small></div>`:`<div onclick="openAcc()"><div class="nm">👤 Entrar / Criar conta</div><small>Necessário para rankeada e online</small></div>`}
function who(){mnu();GOLD=isAdm();$('who').innerHTML=me?`${av(me,18)} ${tagH(me)} ${esc(me.n)} • ${rk(me.r,me.rankTier)[2]} ${me.r}`:'<small>Convidado • toque em 👤 Conta</small>'}
function setMe(a){me=a;try{localStorage.setItem('oa_me',a.n)}catch(e){}who();openAcc()}
async function login(){const n=$('an').value.trim(),p=$('ap').value,E=$('ae');if(!n||!p)return E.textContent='Preencha nome e senha.';
 if(!AU)return E.textContent='Servidor não configurado (veja o guia).';
 try{await AU.signInWithEmailAndPassword(lc(n)+EM,p);FU=AU.currentUser;let a=await gA(n);if(!a&&lc(n)===lc(OWNER)){a=newAcc(OWNER);await sA(a)}
  if(!a)return E.textContent='Conta não encontrada.';if(a.ban){await AU.signOut();return E.textContent='Conta banida.'}setMe(a)}catch(e){E.textContent='Nome ou senha incorretos.'}}
async function reg(){const n=$('an').value.trim(),p=$('ap').value,E=$('ae');
 if(!AU)return E.textContent='Servidor não configurado (veja o guia).';
 if(!/^[A-Za-z0-9_]{3,14}$/.test(n))return E.textContent='Nome: 3 a 14 letras, números ou _.';if(p.length<6)return E.textContent='Senha com no mínimo 6 caracteres.';
 try{const c=await AU.createUserWithEmailAndPassword(lc(n)+EM,p);FU=c.user;const a=newAcc(n);await sA(a);setMe(a)}catch(e){E.textContent=e.code==='auth/email-already-in-use'?'Esse nome já existe.':'Não consegui criar a conta.'}}
function logout(){leaveNet();if(AU)AU.signOut();FU=null;me=null;try{localStorage.removeItem('oa_me')}catch(e){}who();modal.close()}
function openAcc(){
 if(!me){show('👤 Conta',`<p>Crie uma conta para jogar rankeada e online.</p><input id="an" class="in" placeholder="Nome (3-14: letras, números, _)" maxlength="14" autocapitalize="off"><input id="ap" class="in" type="password" placeholder="Senha (mínimo 6)"><p class="thint" id="ae"></p><button class="action" onclick="login()">Entrar</button> <button class="action alt" onclick="reg()">Criar conta</button>${DB?'':'<p><small>Sem servidor aqui: a conta fica só neste aparelho.</small></p>'}`);return}
 const a=me,r=rk(a.r,a.rankTier),own=tagsOf(a);
 show('Minha conta',`<div class="prof" style="cursor:pointer" title="Trocar foto" onclick="$('pf').click()">${av(a,64)}<div><div class="nm">${tagH(a)} ${esc(a.n)}</div><div>${r[2]} ${r[1]} • ${a.r} pts</div><small>${a.w}V ${a.l}D • ${a.g} partidas • maior sequência ${a.bst}</small></div></div>${isAdm()?`<p class="own">${authRole==='owner'?'👑 OWNER • controle principal':'🛡️ ADMINISTRADOR • acesso administrativo'}</p>`:''}<h3>🏅 Tags</h3><div>${[...Object.keys(TG),...(a.xt||[])].map(k=>`<span class="tag ${own.includes(k)?'':'lock'}" title="${(TG[k]||['','Concedida pelo dono'])[1]}">${(TG[k]||['🎁'])[0]} [${esc(k)}]</span>`).join(' ')}</div><small>Passe o mouse (ou segure) numa tag para ver o objetivo.</small><p><label class="action light" style="display:inline-block">📷 Foto<input type="file" accept="image/*" hidden onchange="setAv(this)"></label> <button class="action light" onclick="lead()">Ranking</button> ${isAdm()?'<button class="action alt" onclick="location.href=&quot;admin.html&quot;">🛠️ Painel Admin</button>':''} <button class="action alt" onclick="logout()">Sair</button></p>`)}
function setAv(i){const f=i.files[0];i.value='';if(!f)return;const im=new Image();im.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=72;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,72,72);me.av=c.toDataURL('image/jpeg',.7);try{await sA(me)}catch(e){}who();openAcc()};im.src=URL.createObjectURL(f)}
async function lead(){if(!DB)return show('Ranking','<p>O ranking global só funciona na versão publicada (online).</p>');
 try{const q=await DB.collection('accounts').orderBy('r','desc').limit(10).get();show('🏆 Top 10',`<ol>${q.docs.map(d=>d.data()).filter(a=>!a.ban).map(a=>`<li>${av(a,22)} ${tagH(a)} ${esc(a.n)} • ${rk(a.r,a.rankTier)[2]} ${a.r}</li>`).join('')}</ol>`)}catch(e){show('Ranking','<p>Não consegui carregar o ranking.</p>')}}
function admin(){if(!isAdm())return;location.href='admin.html'}
async function adm(){if(!isAdm())return;location.href='admin.html'}

/* partidas */
async function upd(res,ranked){if(!me)return;if(net){if(net.rep)return;net.rep=1}
 const a=(await gA(me.n).catch(()=>null))||me,opp=net?net.ro[1-net.seat]:1200;
 a.g++;if(res===1){a.w++;a.st++;a.bst=Math.max(a.bst,a.st)}else if(res===0){a.l++;a.st=0}a.cap=Math.max(a.cap,mc);
 const old=tagsOf(a).length,r0=a.r;if(ranked)a.r=Math.max(0,Math.round(a.r+32*(res-1/(1+10**((opp-a.r)/400)))));
 me=a;try{await sA(a)}catch(e){}who();
 say((ranked?`Rankeada: ${a.r-r0>=0?'+':''}${a.r-r0} pts (${rk(a.r,a.rankTier)[2]} ${rk(a.r,a.rankTier)[1]}). `:'')+(tagsOf(a).length>old?'🏅 Nova tag desbloqueada! Veja em Conta.':''))}
function report(){if(!me||(!net&&!rkd))return;const s=net?net.seat:0,d=score[s]-score[1-s];upd(d>0?1:d<0?0:.5,(net&&net.rk)||(!net&&rkd))}
function resEnd(w){if(!net||net.done)return;net.done=1;score[w]=Math.max(25,score[w]);over=true;busy=false;ui();say(`${names[w]} venceu por desistência.`);showWin();report()}
function resign(){if(!net||over)return;DB.doc('matches/'+net.mid).update({res:net.seat}).catch(()=>{});resEnd(1-net.seat)}
async function pump(){if(pmp)return;pmp=1;while(net&&net.n<net.moves.length){while(busy)await sleep(60);if(!net)break;await play(net.moves[net.n++],1)}pmp=0}
function onM(s){if(!s.exists||!net)return;const d=s.data();
 if(!net.on){if(!d.b)return;net.on=1;modal.open&&modal.close();net.seat=lc(d.a)===lc(me.n)?0:1;net.ro=[d.ra,d.rb];names[0]=d.a;names[1]=d.b;reset();th=net.seat?Math.PI:0;say(`${d.k?'🏆 Rankeada':'🌐 Online'}: ${d.a} (🟤) vs ${d.b} (⚪). ${net.seat?'Aguarde a sua vez.':'Você começa!'}`)}
 if(d.moves.length>net.moves.length){net.moves=d.moves.slice();pump()}
 if(d.res>=0&&!net.done)resEnd(1-d.res)}
function qEnd(){if(qun){qun();qun=null}if(me&&DB)DB.doc('queue/'+lc(me.n)).delete().catch(()=>{})}
function startNet(mid,k){qEnd();$('cpu').checked=false;rkd=null;mc=0;net={mid,moves:[],n:0,on:0,rk:!!k};mun=DB.doc('matches/'+mid).onSnapshot(onM);$('resb').style.display='';modal.close()}
function leaveNet(){if(mun){mun();mun=null}qEnd();const w=net;net=null;pmp=0;$('resb').style.display='none';if(w||rkd){rkd=null;$('cpu').checked=false;names[0]='Jogador 1';names[1]='Jogador 2';th=0;reset()}}
async function findMatch(k){if(!me)return openAcc();
 if(!DB)return show('🌐 Online','<p>O modo online só funciona na versão publicada (link do jogo). Aqui você pode jogar a rankeada contra o computador.</p>');
 qEnd();show('🌐 Procurando adversário…','<p>Aguardando alguém entrar na fila'+(k?' da rankeada':'')+'…</p><button class="action alt" onclick="qEnd();modal.close()">Cancelar</button>');
 const id=lc(me.n);mk=0;
 try{await DB.doc('queue/'+id).set({n:me.n,r:me.r,k:k?1:0,t:Date.now(),m:''})}catch(e){return show('Online','<p>Sem permissão para entrar na fila. Peça ao dono para te convidar como colaborador.</p>')}
 qun=DB.collection('queue').onSnapshot(async s=>{if(net)return;const D=s.docs.map(d=>({id:d.id,...d.data()})),mine=D.find(d=>d.id===id);if(!mine)return;
  if(mine.m)return startNet(mine.m,mine.k);
  const o=D.find(d=>d.id!==id&&!d.m&&d.k===mine.k&&Date.now()-d.t<9e4);
  if(o&&id<o.id&&!mk){mk=1;const mid=id+'_'+o.id+'_'+Date.now();
   try{await DB.doc('matches/'+mid).set({a:mine.n,b:o.n,ra:mine.r,rb:o.r,k:mine.k,moves:[],res:-1});await DB.doc('queue/'+o.id).update({m:mid}).catch(()=>{});await DB.doc('queue/'+id).update({m:mid})}catch(e){mk=0}}})}
function vsCpu(){LV=2;rkd=true;net=null;$('cpu').checked=true;names[0]=me.n;names[1]='Computador';mc=0;reset();say('🏆 Rankeada vs Computador valendo pontos. Boa sorte, '+me.n+'!')}
/* botões */
$('acb').onclick=openAcc;$('who').onclick=()=>me?$('pf').click():openAcc();
const mgo=f=>{$('menu').classList.remove('on');f()};
$('mnb').onclick=()=>{mnu();$('menu').classList.add('on')};
$('mo').onclick=()=>me?mgo(()=>findMatch(0)):openAcc();
$('mr').onclick=()=>me?mgo(()=>$('rkb').click()):openAcc();
$('mcp').onclick=()=>mgo(()=>{leaveNet();$('cpu').checked=true;names[1]='Computador';reset()});
$('m2p').onclick=()=>mgo(()=>{leaveNet();$('cpu').checked=false;if(names[1]==='Computador')names[1]='Jogador 2';reset()});
$('mtop').onclick=lead;$('mtu').onclick=()=>mgo(startTut);$('onb').onclick=()=>findMatch(0);$('resb').onclick=resign;
$('rkb').onclick=()=>{if(!me)return openAcc();const r=rk(me.r,me.rankTier);show('🏆 Rankeada',`<p>Seu rank: ${r[2]} <b>${r[1]}</b> • ${me.r} pts. Vitórias sobem seus pontos; derrotas e desistências descem.</p><p><button class="action" onclick="modal.close();findMatch(1)">🌐 Online rankeada</button></p><p><button class="action alt" onclick="modal.close();vsCpu()">🖥️ Contra o computador</button></p>`)};
$('crb').onclick=()=>show('Créditos',`<p><b>Oware 3D</b> • Mancala da África Ocidental</p><p>Criação, design e desenvolvimento: <b>Eduardo</b></p><p>Dono do jogo: <span class="tag dudu">👑 [DUDU+++]</span> <b>Technodudu</b></p><p><small>Privacidade: guardamos só nome de jogador, foto, pontos e partidas. O login usa um e-mail fictício, nenhum dado real é coletado. Para apagar sua conta, fale com o dono.</small></p>`);
$('new').onclick=()=>{if(net&&!over)return say('Partida online em andamento. Use 🏳️ Desistir para sair.');
 if(rkd&&!over&&(score[0]||score[1]||h.join()!=='4,4,4,4,4,4,4,4,4,4,4,4'))upd(0,true);if(net)return leaveNet();reset()};
$('again').onclick=()=>net?leaveNet():reset();
$('cpu').addEventListener('change',()=>{if(!$('cpu').checked)rkd=null});
modal.addEventListener('close',()=>{if(qun&&!net)qEnd()});
USR={isOwner:()=>!!FU&&lc(FU.email||'')===lc(OWNER)+EM};
(async()=>{try{firebase.initializeApp(FB);DB=firebase.firestore();AU=firebase.auth();
 await new Promise(r=>AU.onAuthStateChanged(u=>{FU=u;r()}));
 if(FU){try{const tok=await FU.getIdTokenResult(true);authRole=tok.claims.role||'player'}catch(e){authRole='player'}const a=await gA(FU.email.split('@')[0]);if(a&&!a.ban)me=a}}catch(e){DB=null;AU=null}who()})();
who();

/* ===== v2: dificuldade, salas, tempo, instalar ===== */
function cpuGo(n){LV=n;modal.close();$('menu').classList.remove('on');leaveNet();$('cpu').checked=true;names[1]='Computador';reset()}
$('mcp').onclick=()=>show('🖥️ Dificuldade','<p><button class="action light" onclick="cpuGo(0)">😊 Fácil</button></p><p><button class="action" onclick="cpuGo(1)">🙂 Médio</button></p><p><button class="action alt" onclick="cpuGo(2)">😈 Difícil</button></p>');
$('mrm').onclick=()=>me?show('👥 Sala com amigo','<p><button class="action" onclick="mkRoom()">Criar sala</button></p><p>Ou entre com um código:</p><input id="rc" class="in" placeholder="Código da sala" maxlength="6" autocapitalize="characters"><button class="action alt" onclick="joinRoom()">Entrar</button><p class="thint" id="ae2"></p>'):openAcc();
async function mkRoom(){if(!DB)return show('Sala','<p>Precisa do servidor online.</p>');const c=Math.random().toString(36).slice(2,6).toUpperCase();
 try{await DB.doc('matches/R'+c).set({a:me.n,b:'',ra:me.r,rb:0,k:0,moves:[],res:-1});$('menu').classList.remove('on');startNet('R'+c,0);
  show('👥 Sala '+c,`<p>Mande este código ao seu amigo:</p><p style="font-size:38px;font-weight:800;letter-spacing:6px">${c}</p><p>Aguardando ele entrar…</p><button class="action alt" onclick="leaveNet();modal.close()">Cancelar</button>`)}catch(e){show('Sala','<p>Não consegui criar a sala.</p>')}}
async function joinRoom(){const c=($('rc').value||'').trim().toUpperCase(),E=$('ae2');if(c.length<3)return E.textContent='Digite o código.';
 try{const r=DB.doc('matches/R'+c),x=await r.get();if(!x.exists||x.data().b||x.data().res>=0)return E.textContent='Sala não encontrada ou já ocupada.';
  if(lc(x.data().a)===lc(me.n))return E.textContent='Você criou essa sala.';await r.update({b:me.n,rb:me.r});$('menu').classList.remove('on');startNet('R'+c,0)}catch(e){E.textContent='Não consegui entrar.'}}
setInterval(()=>{if(!net||!net.on||over||net.done)return;const k=player+':'+net.moves.length;if(net.k!==k){net.k=k;net.ts=Date.now()}
 const left=60-Math.floor((Date.now()-net.ts)/1000),my=player===net.seat;$('turn').textContent=`Vez de ${names[player]} ⏱ ${Math.max(0,left)}s`;
 if(my&&left<=-1&&!busy)resign();else if(!my&&left<=-25&&!busy){DB.doc('matches/'+net.mid).update({res:1-net.seat}).catch(()=>{});resEnd(net.seat)}},1000);
$('mtop').onclick=lead;$('mrm').classList.add('alt');
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('mins').style.display=''});$('mins').onclick=()=>ip&&ip.prompt();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
reset();resize();requestAnimationFrame(loop);
try{if(!localStorage.getItem('oware_tut')){localStorage.setItem('oware_tut','1');startTut()}}catch(e){}
</script>
